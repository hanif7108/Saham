## Nginx site config untuk Sharia Trading Assistant
## Place: /etc/nginx/sites-available/sharia-ta
## Then:  sudo ln -s /etc/nginx/sites-available/sharia-ta /etc/nginx/sites-enabled/
##        sudo nginx -t && sudo systemctl reload nginx

upstream sharia_ta_app {
    server 127.0.0.1:8000 fail_timeout=10s;
}

server {
    listen 80;
    server_name sharia-ta.local;  # ganti dengan domain Anda

    # Untuk HTTPS (rekomendasi): pakai certbot
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/sharia-ta.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sharia-ta.example.com/privkey.pem;

    # Logging
    access_log /var/log/nginx/sharia-ta_access.log;
    error_log  /var/log/nginx/sharia-ta_error.log;

    client_max_body_size 10M;

    # Static files served langsung oleh nginx (lebih cepat)
    location /static/ {
        alias /home/hanif/Saham/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy ke gunicorn
    location / {
        proxy_pass         http://sharia_ta_app;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
